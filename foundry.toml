[profile.default]
src = "contracts"
test = "test"
script = "scripts/foundry"
libs = ["lib", "node_modules"]
solc = "0.8.27"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true

# Remappings — Foundry auto-detects lib/forge-std, we add Hardhat-style ones
remappings = [
    "@openzeppelin/=node_modules/@openzeppelin/",
    "@uniswap/=node_modules/@uniswap/",
    "@aave/=node_modules/@aave/",
    "hardhat/=node_modules/hardhat/",
    "forge-std/=lib/forge-std/src/",
]

# Blockscout verification for Robinhood testnet
[etherscan]
robinhood-testnet = { key = "empty", url = "https://explorer.testnet.chain.robinhood.com/api/" }
