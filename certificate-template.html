<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Google Stock NFT Certificate — Template</title>
<style>
  body { margin: 0; padding: 40px; background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .wrapper { text-align: center; }
  .wrapper svg { max-width: 100%; height: auto; border-radius: 16px; box-shadow: 0 0 60px rgba(158,221,62,0.15); }
  .wrapper p { color: #666; font-family: monospace; margin-top: 16px; }
</style>
</head>
<body>
<div class="wrapper">
  <svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
    <defs>
      <linearGradient id="f" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#9edd3e"/>
        <stop offset="100%" stop-color="#6ab520"/>
      </linearGradient>
    </defs>
    <!-- Background -->
    <rect width="600" height="800" fill="#000000" rx="16"/>
    <!-- Border accents -->
    <rect x="12" y="12" width="576" height="776" fill="none" stroke="url(#f)" stroke-width="2" rx="12"/>
    <rect x="20" y="20" width="560" height="760" fill="none" stroke="url(#f)" stroke-width="0.5" rx="8" opacity="0.3"/>
    <!-- Header -->
    <text x="300" y="50" text-anchor="middle" font-family="Georgia,serif" font-size="26" fill="url(#f)" font-weight="bold" letter-spacing="3">IN CHAIN WE TRUST</text>
    <text x="300" y="100" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#ffffff" font-weight="bold">Google Stock Passport</text>
    <text x="300" y="125" text-anchor="middle" font-family="Courier New,monospace" font-size="12" fill="#8888aa">ERC-6551 Token Bound Account</text>
    <line x1="80" y1="140" x2="520" y2="140" stroke="url(#f)" stroke-width="1" opacity="0.5"/>
    <!-- Token ID -->
    <text x="300" y="180" text-anchor="middle" font-family="Courier New,monospace" font-size="48" fill="url(#f)" font-weight="bold">#XXX</text>
    <!-- Shares Section -->
    <text x="90" y="255" font-family="Courier New,monospace" font-size="13" fill="#667799">ALPHABET (GOOGLE) SHARES</text>
    <!-- GOOGL Share -->
    <text x="90" y="290" font-family="Georgia,serif" font-size="15" fill="#8888aa">GOOGL Share</text>
    <text x="510" y="290" text-anchor="end" font-family="Courier New,monospace" font-size="18" fill="#ffffff" font-weight="bold">X.XXXX GOOGL</text>
    <line x1="90" y1="302" x2="510" y2="302" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
    <!-- PILE Share -->
    <text x="90" y="335" font-family="Georgia,serif" font-size="15" fill="#8888aa">$PILE Share</text>
    <text x="510" y="335" text-anchor="end" font-family="Courier New,monospace" font-size="18" fill="#9edd3e" font-weight="bold">$1.00</text>
    <line x1="90" y1="347" x2="510" y2="347" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
    <!-- Stock Value -->
    <text x="90" y="380" font-family="Georgia,serif" font-size="15" fill="#8888aa">Stock Value (USD)</text>
    <text x="510" y="380" text-anchor="end" font-family="Courier New,monospace" font-size="18" fill="#ffffff" font-weight="bold">$5.00</text>
    <line x1="90" y1="392" x2="510" y2="392" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
    <!-- GOOGL Price at Mint -->
    <text x="90" y="425" font-family="Georgia,serif" font-size="15" fill="#8888aa">GOOGL Price at Mint</text>
    <text x="510" y="425" text-anchor="end" font-family="Courier New,monospace" font-size="18" fill="#9edd3e" font-weight="bold">$XXX.XX</text>
    <line x1="90" y1="437" x2="510" y2="437" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
    <!-- Mint Date -->
    <text x="90" y="470" font-family="Georgia,serif" font-size="15" fill="#8888aa">Mint Date</text>
    <text x="510" y="470" text-anchor="end" font-family="Courier New,monospace" font-size="18" fill="#ffffff" font-weight="bold">YYYY-MM-DD</text>
    <line x1="90" y1="482" x2="510" y2="482" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
    <!-- TBA Account -->
    <text x="90" y="530" font-family="Courier New,monospace" font-size="12" fill="#667799">ERC-6551 SMART ACCOUNT</text>
    <text x="90" y="560" font-family="Courier New,monospace" font-size="14" fill="#ffffff">0x0000...0000</text>
    <text x="90" y="583" font-family="Courier New,monospace" font-size="11" fill="#667799">Assets (PILE + GOOGL) held in this smart account</text>
    <!-- Network -->
    <text x="90" y="642" font-family="Courier New,monospace" font-size="12" fill="#8888aa">Network</text>
    <text x="510" y="642" text-anchor="end" font-family="Courier New,monospace" font-size="13" fill="#ffffff">Robinhood Chain</text>
    <!-- Minter -->
    <text x="90" y="685" font-family="Courier New,monospace" font-size="11" fill="#8888aa">Minter</text>
    <text x="510" y="685" text-anchor="end" font-family="Courier New,monospace" font-size="10" fill="#ffffff">0x0000...0000</text>
    <line x1="80" y1="710" x2="520" y2="710" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <!-- Footer -->
    <text x="300" y="750" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#555577">NFT created by: @StocksNFT_ | stock shares tokenized by Robinhood Chain</text>
    <!-- Corner accents -->
    <circle cx="30" cy="30" r="4" fill="url(#f)" opacity="0.5"/>
    <circle cx="570" cy="30" r="4" fill="url(#f)" opacity="0.5"/>
    <circle cx="30" cy="770" r="4" fill="url(#f)" opacity="0.5"/>
    <circle cx="570" cy="770" r="4" fill="url(#f)" opacity="0.5"/>
  </svg>
  <p>Google Stock NFT — Certificate Template (#001)</p>
</div>
</body>
</html>
