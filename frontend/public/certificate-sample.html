<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Sample On-Chain NFT Certificate</title></head>
<body style="background:#1a1a2e;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0">
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9edd3e"/>
      <stop offset="100%" style="stop-color:#6ab520"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9edd3e"/>
      <stop offset="100%" style="stop-color:#6ab520"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="800" fill="#000000" rx="16"/>
  
  <!-- Border -->
  <rect x="12" y="12" width="576" height="776" fill="none" stroke="url(#frame)" stroke-width="2" rx="12"/>
  <rect x="20" y="20" width="560" height="760" fill="none" stroke="url(#frame)" stroke-width="0.5" rx="8" opacity="0.3"/>
  
  <!-- Header -->
  <text x="300" y="50" text-anchor="middle" font-family="Young Serif,Georgia,serif" font-size="26" fill="url(#frame)" font-weight="bold" letter-spacing="3">IN CHAIN WE TRUST</text>
  <text x="300" y="100" text-anchor="middle" font-family="Young Serif,Georgia,serif" font-size="22" fill="#ffffff" font-weight="bold">Google Stock Passport</text>
  <text x="300" y="125" text-anchor="middle" font-family="Courier New,monospace" font-size="12" fill="#8888aa">ERC-6551 Token Bound Account</text>
  <line x1="80" y1="140" x2="520" y2="140" stroke="url(#accent)" stroke-width="1" opacity="0.5"/>
  
  <!-- Token ID -->
  <text x="300" y="180" text-anchor="middle" font-family="Courier New,monospace" font-size="48" fill="url(#frame)" font-weight="bold">#001</text>
  
  <text x="90" y="255" font-family="Courier New,monospace" font-size="13" fill="#667799">ALPHABET (GOOGLE) SHARES</text>
  
  <!-- Data rows -->
  <text x="90" y="290" font-family="Georgia,serif" font-size="15" fill="#8888aa">GOOGL Share</text>
  <text x="510" y="290" text-anchor="end" font-family="Courier New,monospace" font-size="18" fill="#ffffff" font-weight="bold">0.0125 GOOGL</text>
  <line x1="90" y1="302" x2="510" y2="302" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
  
  <text x="90" y="335" font-family="Georgia,serif" font-size="15" fill="#8888aa">$PILE Share</text>
  <text x="510" y="335" text-anchor="end" font-family="Courier New,monospace" font-size="18" fill="#9edd3e" font-weight="bold">$1.00</text>
  <line x1="90" y1="347" x2="510" y2="347" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
  
  <text x="90" y="380" font-family="Georgia,serif" font-size="15" fill="#8888aa">Stock Value (USD)</text>
  <text x="510" y="380" text-anchor="end" font-family="Courier New,monospace" font-size="18" fill="#ffffff" font-weight="bold">$5.00</text>
  <line x1="90" y1="392" x2="510" y2="392" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
  
  <text x="90" y="425" font-family="Georgia,serif" font-size="15" fill="#8888aa">GOOGL Price at Mint</text>
  <text x="510" y="425" text-anchor="end" font-family="Courier New,monospace" font-size="18" fill="#9edd3e" font-weight="bold">$320.94</text>
  <line x1="90" y1="437" x2="510" y2="437" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
  
  <text x="90" y="470" font-family="Georgia,serif" font-size="15" fill="#8888aa">Mint Date</text>
  <text x="510" y="470" text-anchor="end" font-family="Courier New,monospace" font-size="16" fill="#ffffff" font-weight="bold">2026-07-24</text>
  
  <!-- TBA Section -->
  <text x="90" y="530" font-family="Courier New,monospace" font-size="12" fill="#667799">ERC-6551 SMART ACCOUNT</text>
  <text x="90" y="560" font-family="Courier New,monospace" font-size="14" fill="#ffffff">0x088D46B14C6FB2c5eB4BeE620d7C6a49E262222F</text>
  <text x="90" y="583" font-family="Courier New,monospace" font-size="11" fill="#667799">Assets (PILE + GOOGL) held in this smart account</text>
  
  <!-- Network -->
  <text x="90" y="642" font-family="Courier New,monospace" font-size="12" fill="#8888aa">Network</text>
  <text x="510" y="642" text-anchor="end" font-family="Courier New,monospace" font-size="13" fill="#ffffff">Robinhood Chain</text>
  
  <!-- Minter -->
  <text x="90" y="685" font-family="Courier New,monospace" font-size="11" fill="#8888aa">Minter</text>
  <text x="510" y="685" text-anchor="end" font-family="Courier New,monospace" font-size="10" fill="#ffffff">0x2bAFb4...1cc1E</text>
  
  <!-- Footer -->
  <line x1="80" y1="710" x2="520" y2="710" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="300" y="750" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#555577">NFT created by: @StocksNFT_ | stock shares tokenized by Robinhood Chain</text>
  
  <!-- Corner decorations -->
  <circle cx="30" cy="30" r="4" fill="url(#frame)" opacity="0.5"/>
  <circle cx="570" cy="30" r="4" fill="url(#frame)" opacity="0.5"/>
  <circle cx="30" cy="770" r="4" fill="url(#frame)" opacity="0.5"/>
  <circle cx="570" cy="770" r="4" fill="url(#frame)" opacity="0.5"/>
</svg>
</body></html>
